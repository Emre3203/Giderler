<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ev Giderleri</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a24;
    --surface2: #22222f;
    --accent: #f0c040;
    --accent2: #e07a3a;
    --red: #e05555;
    --green: #55c77a;
    --text: #f0ede8;
    --muted: #7a7a99;
    --border: #2e2e42;
    --radius: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 430px;
    margin: 0 auto;
    padding-bottom: 100px;
  }

  /* HEADER */
  .header {
    padding: 48px 24px 24px;
    background: linear-gradient(180deg, #1a1a24 0%, transparent 100%);
    position: sticky;
    top: 0;
    z-index: 10;
    backdrop-filter: blur(20px);
  }

  .header h1 {
    font-family: 'Syne', sans-serif;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  .header h1 span { color: var(--accent); }

  .month-nav {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
  }

  .month-nav button {
    background: var(--surface2);
    border: none;
    color: var(--text);
    width: 36px;
    height: 36px;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .month-label {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 16px;
    flex: 1;
    text-align: center;
    letter-spacing: 0.5px;
  }

  /* SUMMARY CARDS */
  .summary {
    padding: 0 24px 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .summary-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 16px;
    border: 1px solid var(--border);
  }

  .summary-card.total {
    grid-column: 1 / -1;
    background: linear-gradient(135deg, #1e1a0e 0%, #2a2010 100%);
    border-color: #3a3010;
  }

  .summary-card .label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .summary-card .amount {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 700;
  }

  .summary-card.total .amount { font-size: 30px; color: var(--accent); }

  /* CATEGORY FILTER */
  .filter-scroll {
    padding: 0 24px 16px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .filter-scroll::-webkit-scrollbar { display: none; }

  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 14px;
    border-radius: 100px;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.2s;
  }

  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    font-weight: 600;
  }

  /* EXPENSE LIST */
  .section-title {
    padding: 0 24px 12px;
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    font-weight: 500;
  }

  .expense-list {
    padding: 0 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .expense-item {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    border: 1px solid var(--border);
    animation: slideIn 0.25s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .expense-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }

  .expense-info { flex: 1; min-width: 0; }

  .expense-name {
    font-weight: 500;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .expense-meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .expense-right { text-align: right; flex-shrink: 0; }

  .expense-amount {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 16px;
    color: var(--red);
  }

  .expense-date {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .delete-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
    opacity: 0.5;
    transition: opacity 0.2s;
    flex-shrink: 0;
  }
  .delete-btn:hover, .delete-btn:active { opacity: 1; color: var(--red); }

  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--muted);
  }
  .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; }

  /* ADD BUTTON */
  .fab {
    position: fixed;
    bottom: 28px;
    right: 50%;
    transform: translateX(50%);
    max-width: 382px;
    width: calc(100% - 48px);
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 100px;
    padding: 18px 24px;
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 8px 32px rgba(240, 192, 64, 0.3);
    transition: transform 0.1s, box-shadow 0.2s;
    z-index: 20;
  }
  .fab:active { transform: translateX(50%) scale(0.97); box-shadow: 0 4px 16px rgba(240, 192, 64, 0.2); }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    backdrop-filter: blur(4px);
  }

  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    padding: 28px 24px 48px;
    width: 100%;
    max-width: 430px;
    margin: 0 auto;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    border-top: 1px solid var(--border);
  }

  .modal-overlay.open .modal {
    transform: translateY(0);
  }

  .modal-handle {
    width: 40px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 24px;
  }

  .modal h2 {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 24px;
  }

  .form-group { margin-bottom: 16px; }

  .form-group label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 8px;
  }

  .form-group input, .form-group select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }

  .form-group input:focus, .form-group select:focus {
    border-color: var(--accent);
  }

  .form-group input::placeholder { color: var(--muted); }

  .cat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  .cat-option {
    background: var(--surface2);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 12px 4px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
  }

  .cat-option.selected {
    border-color: var(--accent);
    background: rgba(240, 192, 64, 0.1);
  }

  .cat-option .icon { font-size: 24px; }
  .cat-option .name { font-size: 10px; color: var(--muted); margin-top: 4px; }
  .cat-option.selected .name { color: var(--accent); }

  .modal-submit {
    width: 100%;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.2s;
  }
  .modal-submit:active { opacity: 0.8; }

  /* CHART BAR */
  .chart-section {
    padding: 0 24px 24px;
  }

  .chart-bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .chart-bar-label {
    width: 28px;
    font-size: 18px;
    text-align: center;
  }

  .chart-bar-bg {
    flex: 1;
    height: 10px;
    background: var(--surface2);
    border-radius: 100px;
    overflow: hidden;
  }

  .chart-bar-fill {
    height: 100%;
    border-radius: 100px;
    background: var(--accent);
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .chart-bar-amount {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    width: 72px;
    text-align: right;
  }
</style>
</head>
<body>

<div class="header">
  <h1>Ev <span>Giderleri</span></h1>
  <div class="month-nav">
    <button onclick="changeMonth(-1)">‹</button>
    <div class="month-label" id="monthLabel"></div>
    <button onclick="changeMonth(1)">›</button>
  </div>
</div>

<div class="summary">
  <div class="summary-card total">
    <div class="label">Bu ay toplam harcama</div>
    <div class="amount" id="totalAmount">₺0</div>
  </div>
  <div class="summary-card">
    <div class="label">Gider sayısı</div>
    <div class="amount" id="countAmount">0</div>
  </div>
  <div class="summary-card">
    <div class="label">En yüksek</div>
    <div class="amount" id="maxAmount">₺0</div>
  </div>
</div>

<div class="section-title">Kategoriye göre</div>
<div class="chart-section" id="chartSection"></div>

<div class="filter-scroll" id="filterRow"></div>

<div class="section-title" id="listTitle">Harcamalar</div>
<div class="expense-list" id="expenseList"></div>

<button class="fab" onclick="openModal()">
  <span>＋</span> Harcama Ekle
</button>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>Yeni Harcama</h2>

    <div class="form-group">
      <label>Açıklama</label>
      <input type="text" id="inputName" placeholder="Elektrik faturası, market..." />
    </div>

    <div class="form-group">
      <label>Tutar (₺)</label>
      <input type="number" id="inputAmount" placeholder="0.00" inputmode="decimal" />
    </div>

    <div class="form-group">
      <label>Tarih</label>
      <input type="date" id="inputDate" />
    </div>

    <div class="form-group">
      <label>Kategori</label>
      <div class="cat-grid" id="catGrid"></div>
    </div>

    <button class="modal-submit" onclick="addExpense()">Kaydet</button>
  </div>
</div>

<script>
const CATEGORIES = [
  { id: 'fatura',   label: 'Fatura',    icon: '⚡', color: '#f0c040' },
  { id: 'market',   label: 'Market',    icon: '🛒', color: '#55c77a' },
  { id: 'kira',     label: 'Kira',      icon: '🏠', color: '#60a8e0' },
  { id: 'ulasim',   label: 'Ulaşım',    icon: '🚌', color: '#e07a3a' },
  { id: 'saglik',   label: 'Sağlık',    icon: '💊', color: '#e055aa' },
  { id: 'yemek',    label: 'Yemek',     icon: '🍽️', color: '#e05555' },
  { id: 'giyim',    label: 'Giyim',     icon: '👗', color: '#aa55e0' },
  { id: 'eglence',  label: 'Eğlence',   icon: '🎬', color: '#55d0e0' },
  { id: 'bakim',    label: 'Bakım',     icon: '🧴', color: '#e0aa55' },
  { id: 'cocuk',    label: 'Çocuk',     icon: '🧸', color: '#ff8fa3' },
  { id: 'pet',      label: 'Evcil',     icon: '🐾', color: '#a0c060' },
  { id: 'diger',    label: 'Diğer',     icon: '📦', color: '#7a7a99' },
];

const MONTHS_TR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran',
                   'Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];

let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth();
let activeFilter = 'all';
let selectedCategory = 'fatura';

function getKey() { return `expenses_${currentYear}_${currentMonth}`; }

function loadExpenses() {
  try { return JSON.parse(localStorage.getItem(getKey()) || '[]'); } catch { return []; }
}

function saveExpenses(list) {
  localStorage.setItem(getKey(), JSON.stringify(list));
}

function changeMonth(dir) {
  currentMonth += dir;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  if (currentMonth < 0)  { currentMonth = 11; currentYear--; }
  activeFilter = 'all';
  render();
}

function fmt(n) {
  return '₺' + Number(n).toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function render() {
  document.getElementById('monthLabel').textContent = `${MONTHS_TR[currentMonth]} ${currentYear}`;

  const all = loadExpenses();
  const filtered = activeFilter === 'all' ? all : all.filter(e => e.category === activeFilter);

  // Summary
  const total = all.reduce((s, e) => s + e.amount, 0);
  const max = all.length ? Math.max(...all.map(e => e.amount)) : 0;
  document.getElementById('totalAmount').textContent = fmt(total);
  document.getElementById('countAmount').textContent = all.length;
  document.getElementById('maxAmount').textContent = fmt(max);

  // Chart
  const chartEl = document.getElementById('chartSection');
  const catTotals = {};
  all.forEach(e => { catTotals[e.category] = (catTotals[e.category] || 0) + e.amount; });
  const sorted = Object.entries(catTotals).sort((a,b) => b[1]-a[1]).slice(0,5);
  const maxVal = sorted[0]?.[1] || 1;

  chartEl.innerHTML = sorted.map(([id, amt]) => {
    const cat = CATEGORIES.find(c => c.id === id) || CATEGORIES[11];
    const pct = (amt / maxVal * 100).toFixed(1);
    return `<div class="chart-bar-row">
      <div class="chart-bar-label">${cat.icon}</div>
      <div class="chart-bar-bg"><div class="chart-bar-fill" style="width:${pct}%;background:${cat.color}"></div></div>
      <div class="chart-bar-amount">${fmt(amt)}</div>
    </div>`;
  }).join('') || '<p style="color:var(--muted);font-size:13px;padding:8px 0">Henüz harcama yok</p>';

  // Filter buttons
  const usedCats = [...new Set(all.map(e => e.category))];
  const filterEl = document.getElementById('filterRow');
  filterEl.innerHTML = `<button class="filter-btn ${activeFilter==='all'?'active':''}" onclick="setFilter('all')">Tümü</button>` +
    usedCats.map(id => {
      const cat = CATEGORIES.find(c => c.id === id) || CATEGORIES[11];
      return `<button class="filter-btn ${activeFilter===id?'active':''}" onclick="setFilter('${id}')">${cat.icon} ${cat.label}</button>`;
    }).join('');

  // List
  const listEl = document.getElementById('expenseList');
  document.getElementById('listTitle').textContent = filtered.length ? 'Harcamalar' : '';

  if (!filtered.length) {
    listEl.innerHTML = `<div class="empty-state"><div class="emoji">💸</div><p>Bu ay henüz harcama yok</p></div>`;
    return;
  }

  const sorted2 = [...filtered].sort((a,b) => new Date(b.date) - new Date(a.date));
  listEl.innerHTML = sorted2.map(e => {
    const cat = CATEGORIES.find(c => c.id === e.category) || CATEGORIES[11];
    const d = new Date(e.date + 'T12:00:00');
    const dateStr = d.toLocaleDateString('tr-TR', {day:'numeric', month:'short'});
    return `<div class="expense-item">
      <div class="expense-icon" style="background:${cat.color}22">${cat.icon}</div>
      <div class="expense-info">
        <div class="expense-name">${e.name}</div>
        <div class="expense-meta">${cat.label}</div>
      </div>
      <div class="expense-right">
        <div class="expense-amount">${fmt(e.amount)}</div>
        <div class="expense-date">${dateStr}</div>
      </div>
      <button class="delete-btn" onclick="deleteExpense('${e.id}')">✕</button>
    </div>`;
  }).join('');
}

function setFilter(f) {
  activeFilter = f;
  render();
}

function openModal() {
  // Set today's date
  const today = new Date();
  document.getElementById('inputDate').value = today.toISOString().split('T')[0];
  document.getElementById('inputName').value = '';
  document.getElementById('inputAmount').value = '';
  buildCatGrid();
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => document.getElementById('inputName').focus(), 400);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

function buildCatGrid() {
  document.getElementById('catGrid').innerHTML = CATEGORIES.map(c =>
    `<div class="cat-option ${c.id===selectedCategory?'selected':''}" onclick="selectCat('${c.id}')">
      <div class="icon">${c.icon}</div>
      <div class="name">${c.label}</div>
    </div>`
  ).join('');
}

function selectCat(id) {
  selectedCategory = id;
  buildCatGrid();
}

function addExpense() {
  const name = document.getElementById('inputName').value.trim();
  const amount = parseFloat(document.getElementById('inputAmount').value);
  const date = document.getElementById('inputDate').value;

  if (!name) { document.getElementById('inputName').focus(); return; }
  if (!amount || amount <= 0) { document.getElementById('inputAmount').focus(); return; }
  if (!date) return;

  const list = loadExpenses();
  list.push({
    id: Date.now().toString(),
    name, amount, date,
    category: selectedCategory
  });
  saveExpenses(list);
  closeModal();

  // Switch to the month of the added expense
  const d = new Date(date + 'T12:00:00');
  currentYear = d.getFullYear();
  currentMonth = d.getMonth();
  activeFilter = 'all';
  render();
}

function deleteExpense(id) {
  if (!confirm('Bu harcamayı silmek istiyor musunuz?')) return;
  const list = loadExpenses().filter(e => e.id !== id);
  saveExpenses(list);
  render();
}

// Init
render();
</script>
</body>
</html>
